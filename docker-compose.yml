services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: stg
      POSTGRES_PASSWORD: stg
      POSTGRES_DB: stg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stg -d stg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
