[platformio]
default_envs = node

[env]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.1.0
build_flags =
    -std=gnu++17

[env:node]
lib_deps =
    ${env.lib_deps}
    mathieucarbou/ESPAsyncWebServer@^3.3.0
build_flags =
    ${env.build_flags}
    -DROLE_NODE
    -DNODE_ID=1
    -DNODE_LAT_E6=20140000
    -DNODE_LON_E6=-101180000

[env:gateway]
build_flags =
    ${env.build_flags}
    -DROLE_GATEWAY
    -DNODE_ID=250

[env:portable]
build_flags =
    ${env.build_flags}
    -DROLE_PORTABLE
    -DNODE_ID=100

