<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOS Municipio</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:18px/1.3 system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{margin:0 0 12px;font-size:26px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:0;padding:0;margin:0 0 16px}
.kinds label{display:block}
.kinds input{position:absolute;opacity:0}
.kinds span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;border:3px solid #555;border-radius:14px;font-weight:700;text-align:center}
.kinds input:checked+span{border-color:#ffd400;background:#2a2400}
.kinds input:focus-visible+span{outline:3px solid #fff}
.icon{font-size:30px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.field input{width:96px;padding:10px;font-size:20px;text-align:center;border-radius:10px;border:3px solid #555;background:#111;color:#fff}
button{width:100%;min-height:72px;border:0;border-radius:16px;background:#e00000;color:#fff;font-size:26px;font-weight:800}
button:disabled{background:#555}
#status{margin-top:14px;min-height:48px;font-weight:600}
.ok{color:#5dff7a}
.err{color:#ff7a7a}
</style>
</head>
<body>
<main>
<h1>Pedir ayuda</h1>
<form id="form">
<fieldset class="kinds">
<legend hidden>Tipo de emergencia</legend>
<label><input type="radio" name="kind" value="1" required><span><i class="icon">🆘</i>Persona atrapada</span></label>
<label><input type="radio" name="kind" value="0"><span><i class="icon">🏚️</i>Derrumbe</span></label>
<label><input type="radio" name="kind" value="2"><span><i class="icon">🌊</i>Inundación</span></label>
<label><input type="radio" name="kind" value="3"><span><i class="icon">🔥</i>Incendio</span></label>
<label><input type="radio" name="kind" value="4"><span><i class="icon">🩸</i>Herido grave</span></label>
</fieldset>
<div class="field">
<label for="affected">Personas afectadas</label>
<input id="affected" name="affected" type="number" inputmode="numeric" min="1" max="999" value="1">
</div>
<input type="hidden" name="lat" id="lat">
<input type="hidden" name="lon" id="lon">
<button id="send" type="submit">Enviar SOS</button>
<div id="status" role="status" aria-live="polite">Buscando tu ubicación…</div>
</form>
</main>
<script>
const form = document.getElementById("form");
const send = document.getElementById("send");
const statusBox = document.getElementById("status");
const lat = document.getElementById("lat");
const lon = document.getElementById("lon");

function setStatus(text, cls) {
  statusBox.textContent = text;
  statusBox.className = cls || "";
}

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (position) => {
      lat.value = position.coords.latitude;
      lon.value = position.coords.longitude;
      setStatus("Ubicación obtenida");
    },
    () => setStatus("Se usará la ubicación aproximada de este punto de ayuda"),
    { timeout: 4000, maximumAge: 60000 }
  );
} else {
  setStatus("Se usará la ubicación aproximada de este punto de ayuda");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  send.disabled = true;
  setStatus("Enviando…");
  try {
    const response = await fetch("/sos", {
      method: "POST",
      body: new URLSearchParams(new FormData(form)),
    });
    if (!response.ok) throw new Error(String(response.status));
    setStatus("SOS enviado. Mantén la calma, la ayuda fue notificada.", "ok");
  } catch (error) {
    setStatus("No se pudo enviar. Intenta de nuevo.", "err");
    send.disabled = false;
  }
});
</script>
</body>
</html>
