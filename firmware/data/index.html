<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SOS Municipio · Canal de Emergencia</title>
<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --ink: #111111;
  --muted: #666660;
  --line: #dfdfd8;
  --accent: #c81e1e;
  --accent-bg: #fef2f2;
  --ok: #166534;
  --ok-bg: #f0fdf4;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.4;
}
main {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px 16px 32px;
  display: flex;
  flex-direction: column;
}
header {
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
  margin-bottom: 18px;
}
.net-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin: 0 0 8px;
}
.kinds {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  border: 0;
  padding: 0;
  margin: 0 0 20px;
}
.kinds label { display: block; cursor: pointer; }
.kinds input { position: absolute; opacity: 0; pointer-events: none; }
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  transition: border-color 0.12s, background 0.12s;
}
.card-title { font-size: 15px; font-weight: 600; }
.card-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.radio-mark {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid #a1a19a;
  flex-shrink: 0;
  position: relative;
}
.kinds input:checked + .card {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.kinds input:checked + .card .radio-mark {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 3px var(--surface);
}
.stepper-box {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.stepper-label { font-size: 14px; font-weight: 600; }
.stepper-sub { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.step-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-size: 18px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
}
#affected {
  width: 52px;
  height: 38px;
  text-align: center;
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink);
}
.submit-btn {
  width: 100%;
  height: 54px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: -0.01em;
}
.submit-btn:disabled { background: #a1a19a; cursor: default; }
#status {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
#status.ok {
  background: var(--ok-bg);
  border-color: #bbf7d0;
  color: var(--ok);
  font-weight: 500;
}
#status.err {
  background: var(--accent-bg);
  border-color: #fecaca;
  color: var(--accent);
  font-weight: 500;
}
</style>
</head>
<body>
<main>
  <header>
    <div class="net-tag"><span class="dot"></span>RED LOCAL SIN INTERNET · SOS_MUNICIPIO</div>
    <h1>Solicitud de auxilio</h1>
    <p class="sub">Tu reporte se transmite por radio LoRa al Puesto de Comando.</p>
  </header>

  <form id="form">
    <p class="section-label">1. Selecciona el tipo de emergencia</p>
    <fieldset class="kinds">
      <legend hidden>Tipo de emergencia</legend>
      <label>
        <input type="radio" name="kind" value="1" required checked>
        <div class="card">
          <div>
            <div class="card-title">Persona atrapada</div>
            <div class="card-desc">Imposibilidad de salir por propios medios</div>
          </div>
          <span class="radio-mark"></span>
        </div>
      </label>
      <label>
        <input type="radio" name="kind" value="0">
        <div class="card">
          <div>
            <div class="card-title">Derrumbe estructural</div>
            <div class="card-desc">Colapso parcial o total de edificación</div>
          </div>
          <span class="radio-mark"></span>
        </div>
      </label>
      <label>
        <input type="radio" name="kind" value="4">
        <div class="card">
          <div>
            <div class="card-title">Herido grave</div>
            <div class="card-desc">Requiere atención médica urgente</div>
          </div>
          <span class="radio-mark"></span>
        </div>
      </label>
      <label>
        <input type="radio" name="kind" value="2">
        <div class="card">
          <div>
            <div class="card-title">Inundación</div>
            <div class="card-desc">Nivel de agua crítico en vivienda o vía</div>
          </div>
          <span class="radio-mark"></span>
        </div>
      </label>
      <label>
        <input type="radio" name="kind" value="3">
        <div class="card">
          <div>
            <div class="card-title">Incendio</div>
            <div class="card-desc">Fuego activo o fuga de gas</div>
          </div>
          <span class="radio-mark"></span>
        </div>
      </label>
    </fieldset>

    <p class="section-label">2. Personas en el lugar</p>
    <div class="stepper-box">
      <div>
        <div class="stepper-label">Personas afectadas</div>
        <div class="stepper-sub">Número aproximado</div>
      </div>
      <div class="stepper">
        <button type="button" class="step-btn" onclick="stepAffected(-1)">−</button>
        <input id="affected" name="affected" type="number" inputmode="numeric" min="1" max="999" value="1">
        <button type="button" class="step-btn" onclick="stepAffected(1)">+</button>
      </div>
    </div>

    <input type="hidden" name="lat" id="lat">
    <input type="hidden" name="lon" id="lon">
    <button id="send" class="submit-btn" type="submit">Enviar reporte de emergencia</button>
    <div id="status" role="status" aria-live="polite">Obteniendo coordenadas del dispositivo…</div>
  </form>
</main>
<script>
const form = document.getElementById("form");
const send = document.getElementById("send");
const statusBox = document.getElementById("status");
const lat = document.getElementById("lat");
const lon = document.getElementById("lon");
const affectedInput = document.getElementById("affected");

function stepAffected(delta) {
  const next = Math.max(1, Math.min(999, (parseInt(affectedInput.value, 10) || 1) + delta));
  affectedInput.value = next;
}

function setStatus(text, cls) {
  statusBox.textContent = text;
  statusBox.className = cls || "";
}

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (position) => {
      lat.value = position.coords.latitude;
      lon.value = position.coords.longitude;
      setStatus("Coordenadas GPS listas para transmitir.");
    },
    () => setStatus("Sin GPS: se usará la ubicación fija de este poste LoRa."),
    { timeout: 4000, maximumAge: 60000 }
  );
} else {
  setStatus("Sin GPS: se usará la ubicación fija de este poste LoRa.");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  send.disabled = true;
  setStatus("Transmitiendo trama por radio LoRa…");
  try {
    const response = await fetch("/sos", {
      method: "POST",
      body: new URLSearchParams(new FormData(form)),
    });
    if (!response.ok) throw new Error(String(response.status));
    setStatus("Reporte recibido por el nodo LoRa. Permanece en un lugar seguro.", "ok");
    send.textContent = "Enviar otro reporte";
    setTimeout(() => { send.disabled = false; }, 1200);
  } catch (error) {
    setStatus("No se pudo enviar el reporte. Toca el botón para reintentar.", "err");
    send.disabled = false;
  }
});
</script>
</body>
</html>
